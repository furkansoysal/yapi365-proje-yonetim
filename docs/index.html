    <aside class="side ${S.sideOpen?'open':''}">
      <div class="logo">Yapı<span>365</span></div>
      ${MODULES.filter(m=>m[0]!=='YONETIM').map((m,i)=> (i===1?'<div class="grp">Modüller</div>':'') + (m[0]==='MAIL'&&can('MAIL')?'<div class="grp">Otomasyon</div>':'') + (can(m[0])?`<div class="nav ${S.route===m[0]?'on':''}" onclick="go('${m[0]}')"><span>${m[2]}</span>${m[1]}${pending[m[0]]?`<span class="ct">${pending[m[0]]}</span>`:''}</div>`:'')).join('')}
      ${can('YONETIM')?`<div class="grp">Yönetim</div>
        <div class="nav ${S.route==='ROLES'?'on':''}" onclick="go('ROLES')"><span>🔐</span>Roller ve Yetkiler</div>

    </aside>
    <div class="main">
      <div class="top">
        <button class="btn s sm mob-menu" onclick="S.sideOpen=!S.sideOpen;render()">☰</button>
        <select onchange="S.project=+this.value;toast('Proje değişti: '+this.options[this.selectedIndex].text);render()">${PROJECTS.map(p=>`<option value="${p.id}" ${p.id===S.project?'selected':''}>${p.code} · ${p.name}</option>`).join('')}</select>
        <div class="sp"></div>

}
function go(r){ S.route=r; S.sideOpen=false; render(); window.scrollTo(0,0); }
function view(){
  return ({DASH:dash,DOKUMAN:docs,SOZLESME:contracts,HAKEDIS:hakedis,FATURA:invoices,CLAIM:claims,IS_PROGRAMI:schedule,
    PUANTAJ:puantaj,EKIPMAN:equipment,ISG:isg,IK:hr,MAIL:mail,ROLES:roles,AUDIT:audit}[S.route]||dash)();
}
function pendingCount(){
  const c={};
  const hk=S.hakedis.filter(h=>h.status<4 && h.flow[h.status] && (h.flow[h.status].role===S.role||S.role==='SISTEM_YONETICISI')).length;
  if(hk) c.HAKEDIS=hk;
  if(can('FATURA','A')){ const f=S.invoices.filter(i=>i.status==='Onay bekliyor').length; if(f) c.FATURA=f; }
  if(can('IK','A')){ const l=S.leaves.filter(i=>i.status==='Onay bekliyor').length; if(l) c.IK=l; }
  if(can('PUANTAJ','A') && !S.puantajApproved) c.PUANTAJ=1;
  return c;
}
function denied(a){ return `disabled title="Rolünüzün bu işlem için '${a}' yetkisi yok"`; }
function openDrawer(html){ $('drawer').innerHTML='<button class="x" onclick="closeDrawer()">×</button>'+html; $('drawer').classList.add('on'); $('dbg').classList.add('on'); }

/* ---------------- Gösterge paneli ---------------- */
function dash(){
  const p=PROJECTS.find(x=>x.id===S.project);
  const crit=[];
  if(can('SOZLESME')) S.contracts.forEach(c=>c.dates.forEach(d=>{ const k=days(d[1]); if(k>=-10&&k<=60) crit.push({c,label:d[0],date:d[1],k}); }));
  if(can('EKIPMAN')) S.equipment.forEach(e=>{ if(e.docEnd&&days(e.docEnd)<=30) crit.push({c:{no:e.code,party:e.name},label:e.doc,date:e.docEnd,k:days(e.docEnd)}); });
  if(can('ISG')) S.health.forEach(h=>{ if(days(h.end)<=30) crit.push({c:{no:'İSG',party:h.p},label:h.test,date:h.end,k:days(h.end)}); });
  crit.sort((a,b)=>a.k-b.k);
  const hk=S.hakedis[0]; const hkTotal=hk.items.reduce((s,i)=>s+i.cur*i.price,0);
  const overdue=S.invoices.filter(i=>i.paid<i.amount && days(i.due)<0);
  const prog=Math.round(S.tasks.reduce((s,t)=>s+t.p*(t.e-t.s||1),0)/S.tasks.reduce((s,t)=>s+(t.e-t.s||1),0));
  const approvals=[];
  if(can('HAKEDIS')) S.hakedis.forEach(h=>{ if(h.status<4){ const st=h.flow[h.status]; approvals.push({t:`Hakediş No ${h.no} · ${st.t}`,who:ROLES[st.role].name,mine:st.role===S.role||S.role==='SISTEM_YONETICISI',go:'HAKEDIS'}); }});
  if(can('FATURA')) S.invoices.filter(i=>i.status==='Onay bekliyor').forEach(i=>approvals.push({t:`Fatura ${i.no} onayı`,who:'Muhasebe / Finans',mine:can('FATURA','A'),go:'FATURA'}));
  if(can('IK')) S.leaves.filter(l=>l.status==='Onay bekliyor').forEach(l=>approvals.push({t:`${l.p} · ${l.type} (${l.dayCount} gün)`,who:'İK Uzmanı',mine:can('IK','A'),go:'IK'}));
  if(can('PUANTAJ')&&!S.puantajApproved) approvals.push({t:'Haftalık puantaj onayı',who:'Şantiye Şefi',mine:can('PUANTAJ','A'),go:'PUANTAJ'});
  return `
  <h1>${p.name}</h1><p class="sub">${p.code} · ${fD(TODAY)} · Hoş geldiniz, ${me().split(' ')[0]}</p>
  <div class="grid g4">
    <div class="card kpi"><div class="v">%${prog}</div><div class="l">Fiziksel ilerleme</div><div class="bar up"><i style="width:${prog}%"></i></div></div>
    ${can('HAKEDIS')?`<div class="card kpi"><div class="v">${fM(hkTotal/1e6)} M₺</div><div class="l">Bu dönem hakediş (No ${hk.no})</div></div>`:`<div class="card kpi"><div class="v">${S.docs.length}</div><div class="l">Doküman</div></div>`}
    ${can('FATURA')?`<div class="card kpi"><div class="v" style="color:${overdue.length?'var(--bad)':'inherit'}">${overdue.length}</div><div class="l">Vadesi geçmiş fatura</div></div>`:`<div class="card kpi"><div class="v">${S.contracts.length}</div><div class="l">Aktif sözleşme</div></div>`}
    <div class="card kpi"><div class="v">${crit.filter(x=>x.k<=30).length}</div><div class="l">30 gün içinde kritik tarih</div></div>
  </div>
  <div class="grid g21">
    <div class="card"><h2>Kritik tarihler ve uyarılar</h2><div class="tw"><table>
      <tr><th>Kayıt</th><th>Olay</th><th>Tarih</th><th>Kalan</th></tr>
      ${crit.slice(0,8).map(x=>`<tr><td><b>${esc(x.c.no)}</b> <span class="muted">${esc(x.c.party)}</span></td><td>${esc(x.label)}</td><td>${fD(x.date)}</td><td><span class="b ${x.k<0?'bad':x.k<=30?'warn':'grey'}">${x.k<0?Math.abs(x.k)+' gün geçti':x.k+' gün'}</span></td></tr>`).join('')}
    </table></div></div>
    <div class="card"><h2>Onay bekleyenler</h2>
      ${approvals.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><a onclick="go('${a.go}')"><b>${esc(a.t)}</b></a><div class="small muted">${esc(a.who)} ${a.mine?'· <span class="b ok">Sizde</span>':''}</div></div>`).join('')||'<p class="muted">Bekleyen onay yok</p>'}
    </div>
  </div>
  <div class="grid g2">
    <div class="card" style="${can('IS_PROGRAMI')?'':'display:none'}"><h2>İş programı · kritik yol</h2>${S.tasks.filter(t=>t.c&&!t.ms&&t.p<100).slice(0,3).map(t=>`<div style="margin-bottom:10px"><div class="between"><span>${t.n}</span><span class="small ${t.late?'':'muted'}" style="${t.late?'color:var(--bad)':''}">%${t.p}${t.late?' · '+t.late+' gün gecikme':''}</span></div><div class="bar"><i style="width:${t.p}%;background:${t.late?'#e5484d':'var(--brand2)'}"></i></div></div>`).join('')}<a onclick="go('IS_PROGRAMI')">Gantt'ı aç →</a></div>
    <div class="card"><h2>Son işlemler</h2><table>${S.audit.slice(0,6).map(a=>`<tr><td class="small muted" style="white-space:nowrap">${fDT(a.at)}</td><td><b>${esc(a.user)}</b> · ${esc(a.entity)}: ${esc(a.rec)}<div class="small muted">${esc(a.act)}</div></td></tr>`).join('')}</table></div>
  </div>`;
}

function docs(){
  const f=S.docFolder; const list=S.docs.filter(d=>!f||d.folder===f||d.folder.startsWith(f+'/'));
  const roots=[...new Set(S.folders.map(x=>x.split('/')[0]))];
  return `<div class="between"><div><h1>Doküman Yönetimi</h1><p class="sub">Klasör yapısı ve versiyonlama · her yükleme otomatik olarak SharePoint / OneDrive'a aktarılır</p></div>
    <div class="row"><button class="btn" ${can('DOKUMAN','E')?'':denied('Düzenle')} onclick="uploadDialog()">⬆ Dosya yükle</button></div></div>
  <div class="grid" style="grid-template-columns:240px 1fr">
    <div class="card tree"><div class="${!f?'on':''}" onclick="S.docFolder=null;render()">📁 Tüm dokümanlar</div>
      ${roots.map(r=>`<div class="${f===r?'on':''}" onclick="S.docFolder='${r}';render()">📁 ${r}</div>`+S.folders.filter(x=>x.startsWith(r+'/')).map(x=>`<div style="padding-left:26px" class="${f===x?'on':''}" onclick="S.docFolder='${x}';render()">└ ${x.split('/')[1]}</div>`).join('')).join('')}
    </div>
    <div class="card tw"><table><tr><th>Başlık</th><th>Klasör</th><th>Versiyon</th><th>Son yükleyen</th><th>Tarih</th><th>SharePoint</th></tr>
      ${list.map(d=>{const v=d.v[0];return `<tr class="click" onclick="docDetail(${d.id})"><td><b>${esc(d.title)}</b><div class="small muted">${esc(v.file)} · ${fM(v.size)} MB</div></td><td class="small">${esc(d.folder)}</td><td><span class="b">v${v.n}</span></td><td>${esc(v.by)}</td><td>${fD(v.at)}</td><td>${syncBadge(v.sync)}</td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Bu klasörde doküman yok</td></tr>'}
    </table></div>
  </div>`;
}
function syncBadge(s){ return s==='ok'?'<span class="b ok">✓ Aktarıldı</span>':s==='run'?'<span class="b warn">⟳ Aktarılıyor</span>':'<span class="b grey">Kuyrukta</span>'; }
function docDetail(id){
  const d=S.docs.find(x=>x.id===id);
  openDrawer(`<h1>${esc(d.title)}</h1><p class="sub">${esc(d.folder)}</p>
   <p class="small muted">SharePoint yolu: <code>/ProjeYonetim/${PROJECTS[S.project-1].code}/${esc(d.folder)}/${esc(d.title)}/</code></p>
   <table><tr><th>Versiyon</th><th>Dosya</th><th>Boyut</th><th>Yükleyen</th><th>Tarih</th><th></th></tr>
   ${d.v.map(v=>`<tr><td><b>v${v.n}</b></td><td>${esc(v.file)}</td><td>${fM(v.size)} MB</td><td>${esc(v.by)}</td><td>${fD(v.at)}</td><td>${syncBadge(v.sync)}</td></tr>`).join('')}</table>
   <p class="small muted" style="margin-top:12px">Eski versiyonlar silinmez; her versiyonun SHA-256 özeti tutulur, kim yüklediği işlem geçmişine yazılır.</p>
   ${can('DOKUMAN','E')?`<button class="btn" onclick="closeDrawer();uploadDialog(${d.id})">Yeni versiyon yükle</button>`:''}`);

  const d=docId?S.docs.find(x=>x.id===docId):null;
  openDrawer(`<h1>${d?'Yeni versiyon':'Dosya yükle'}</h1><p class="sub">Aynı klasöre aynı başlıkla yüklenen dosya yeni versiyon olarak eklenir</p>
   <label>Klasör</label><select id="uf">${S.folders.map(f=>`<option ${d&&d.folder===f||(!d&&S.docFolder===f)?'selected':''}>${f}</option>`).join('')}</select>
   <label>Başlık</label><input id="ut" value="${d?esc(d.title):''}" placeholder="Örn. B Blok Mimari Proje">
   <label>Dosya</label><input id="ufile" type="file">
   <p class="small muted">Demo: dosya seçmezseniz 640 MB'lık örnek bir DWG yüklenir. Büyük dosyalar SharePoint'e 10 MB'lık parçalar halinde aktarılır.</p>
   <button class="btn" onclick="doUpload()">Yükle</button><div id="uprog"></div>`);

function doUpload(){
  const folder=$('uf').value, file=$('ufile').files[0];
  const name=file?file.name:'B-blok-mimari-rev1.dwg', size=file?Math.max(file.size/1048576,0.01):640;
  const title=$('ut').value.trim()||name.replace(/\.[^.]+$/,'');
  let d=S.docs.find(x=>x.folder===folder&&x.title===title);
  if(!d){ d={id:Date.now(),folder,title,v:[]}; S.docs.unshift(d); }
  const v={n:(d.v[0]?.n||0)+1,file:name,size,by:me(),at:new Date(),sync:'run'}; d.v.unshift(v);
  log('Doküman',title,`v${v.n} yüklendi (${fM(size)} MB)`);
  const chunks=Math.max(1,Math.ceil(size/10)); let i=0;
  $('uprog').innerHTML=`<div style="margin-top:14px"><div class="small">Sunucuya kaydedildi ✓ · SharePoint aktarımı: <span id="uc">0</span>/${chunks} parça</div><div class="bar up"><i id="ub" style="width:0"></i></div></div>`;
  const t=setInterval(()=>{ i=Math.min(chunks,i+Math.ceil(chunks/12)); $('uc')&&($('uc').textContent=i); $('ub')&&($('ub').style.width=(i/chunks*100)+'%');
    if(i>=chunks){ clearInterval(t); v.sync='ok'; log('Doküman',title,`v${v.n} SharePoint'e aktarıldı`); setTimeout(()=>{closeDrawer();S.docFolder=folder;render();toast(`${title} v${v.n} yüklendi ve SharePoint'e aktarıldı`);},500);} },180);
}

/* ---------------- Hakediş ---------------- */
function hakedis(){
  const h=S.hakedis.find(x=>x.id===(S.hkSel||S.hakedis[0].id));
  const rows=h.items.map(i=>({...i,cum:i.prev+i.cur}));
  const tPrev=rows.reduce((s,i)=>s+i.prev*i.price,0), tCur=rows.reduce((s,i)=>s+i.cur*i.price,0);
  const ret=tCur*0.05, kdv=(tCur-ret)*0.20;
  const step=h.flow[h.status]; const myTurn=h.status<4&&(step.role===S.role||S.role==='SISTEM_YONETICISI')&&can('HAKEDIS','A');
  const editable=h.status<=1&&can('HAKEDIS','E');
  return `<div class="between"><div><h1>İlerleme Bazlı Faturalama</h1><p class="sub">Kalem ve miktar girişi · kümülatif hesap · çok aşamalı onay · PDF / Excel çıktı</p></div>
    <div class="row noprint"><select style="width:auto" onchange="S.hkSel=+this.value;render()">${S.hakedis.map(x=>`<option value="${x.id}" ${x.id===h.id?'selected':''}>Hakediş No ${x.no} · ${x.period}</option>`).join('')}</select>
    <button class="btn s" onclick="exportCsv(${h.id})">⬇ Excel</button><button class="btn s" onclick="window.print()">⬇ PDF</button></div></div>
  <div class="card"><div class="between"><h2>Onay akışı</h2>${h.status>=4?'<span class="b ok">Onaylandı · faturaya hazır</span>':`<span class="b warn">Sırada: ${ROLES[step.role].name}</span>`}</div>
   <div class="steps">${h.flow.map((f,i)=>`<div class="step ${i<h.status||h.status>=4?'done':i===h.status?'cur':''}"><div class="t">${i<h.status||h.status>=4?'✓ ':''}${f.t}</div><div class="d">${f.who?esc(f.who)+' · '+fD(f.at):ROLES[f.role].name}</div></div>`).join('')}</div>
   ${h.status<4?`<div class="row noprint" style="margin-top:10px"><button class="btn g" ${myTurn?'':`disabled title="Bu adımı ${ROLES[step.role].name} onaylar"`} onclick="approveHk(${h.id})">✓ Onayla ve ilerlet</button>
   <button class="btn r" ${myTurn&&h.status>0?'':'disabled'} onclick="rejectHk(${h.id})">↩ Düzeltmeye gönder</button>
   ${myTurn?'':`<span class="small muted">Bu adım sizin rolünüzde değil. Rol değiştirerek akışı deneyebilirsiniz.</span>`}</div>`:''}
  </div>
  ${h.items.length?`<div class="card tw"><h2>Hakediş No ${h.no} · ${h.period} · ${h.contract}</h2><table>
   <tr><th>Poz</th><th>İş kalemi</th><th>Birim</th><th class="num">Birim fiyat</th><th class="num">Sözleşme miktarı</th><th class="num">Önceki kümülatif</th><th class="num">Bu dönem</th><th class="num">Toplam kümülatif</th><th>%</th><th class="num">Bu dönem tutar</th></tr>
   ${rows.map((i,ix)=>{const pc=Math.round(i.cum/i.qty*100);return `<tr><td class="small">${i.code}</td><td>${i.name}</td><td>${i.unit}</td><td class="num">${fM(i.price)}</td><td class="num">${fM(i.qty)}</td><td class="num">${fM(i.prev)}</td>
   <td class="num">${editable?`<input type="number" value="${i.cur}" style="width:90px;text-align:right" onchange="setQty(${h.id},${ix},this.value)">`:fM(i.cur)}</td>
   <td class="num"><b>${fM(i.cum)}</b></td><td style="min-width:70px"><div class="bar"><i style="width:${Math.min(pc,100)}%;background:${pc>100?'#e5484d':'var(--brand2)'}"></i></div><span class="small ${pc>100?'':'muted'}" style="${pc>100?'color:var(--bad)':''}">%${pc}${pc>100?' aşım!':''}</span></td><td class="num"><b>${fM(i.cur*i.price)}</b></td></tr>`}).join('')}
   </table>
   <div style="display:flex;justify-content:flex-end;margin-top:12px"><table style="width:auto;min-width:320px">
    <tr><td>Önceki hakedişler toplamı</td><td class="num">${fM(tPrev)} ₺</td></tr>
    <tr><td><b>Bu dönem imalat tutarı</b></td><td class="num"><b>${fM(tCur)} ₺</b></td></tr>
    <tr><td>Teminat kesintisi (%5)</td><td class="num">-${fM(ret)} ₺</td></tr>
    <tr><td>KDV (%20)</td><td class="num">${fM(kdv)} ₺</td></tr>
    <tr><td><b>Ödenecek tutar</b></td><td class="num"><b>${fM(tCur-ret+kdv)} ₺</b></td></tr>

   ${editable?'<p class="small muted noprint">Miktarı değiştirdiğinizde kümülatif, yüzde ve tutarlar anında yeniden hesaplanır. Sözleşme miktarını aşan kalemler kırmızı uyarı verir.</p>':''}
  </div>`:`<div class="card"><p>Bu hakediş onaylandı ve faturalandı. Toplam: <b>${fM(h.total)} ₺</b></p></div>`}`;

function setQty(id,ix,v){ const h=S.hakedis.find(x=>x.id===id); const it=h.items[ix]; const old=it.cur; it.cur=Math.max(0,+v||0); log('Hakediş','Hakediş No '+h.no,`${it.code} bu dönem miktarı: ${fM(old)} → ${fM(it.cur)}`); render(); }
function approveHk(id){ const h=S.hakedis.find(x=>x.id===id); const st=h.flow[h.status]; st.who=me(); st.at=new Date(); log('Hakediş','Hakediş No '+h.no,`${st.t} verildi`); h.status++;
  toast(h.status>=4?'Hakediş onaylandı, fatura taslağı oluşturuldu':`Onaylandı → sırada ${ROLES[h.flow[h.status].role].name} (e-posta bildirimi gönderildi)`); render(); }
function rejectHk(id){ const h=S.hakedis.find(x=>x.id===id); log('Hakediş','Hakediş No '+h.no,'Düzeltmeye geri gönderildi'); for(let i=1;i<h.flow.length;i++){h.flow[i].who=null;h.flow[i].at=null;} h.status=1; h.flow[0].at=new Date(); toast('Hazırlayana geri gönderildi'); render(); }
function exportCsv(id){
  const h=S.hakedis.find(x=>x.id===id);
  const lines=[['Poz','İş kalemi','Birim','Birim fiyat','Sözleşme miktarı','Önceki kümülatif','Bu dönem','Toplam kümülatif','Bu dönem tutar']];
  h.items.forEach(i=>lines.push([i.code,i.name,i.unit,i.price,i.qty,i.prev,i.cur,i.prev+i.cur,i.cur*i.price]));
  const csv='﻿'+lines.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`hakedis-${h.no}.csv`; a.click();
  log('Hakediş','Hakediş No '+h.no,'Excel çıktısı alındı');
}

/* ---------------- İş programı / Gantt ---------------- */
function schedule(){
  const min=-215,max=245,span=max-min, pos=d=>((d-min)/span*100);
  const months=[]; for(let d=new Date(addD(min).getFullYear(),addD(min).getMonth()+1,1); d<=addD(max); d.setMonth(d.getMonth()+1)) months.push(new Date(d));
  const late=S.tasks.filter(t=>t.late);
  return `<div class="between"><div><h1>İş Programı</h1><p class="sub">Primavera P6 (.xer) ve MS Project (.xml / .mpp) içe aktarma · Gantt görünümü · kritik yol ve gecikme alarmları</p></div>
   <div class="row"><button class="btn s" ${can('IS_PROGRAMI','E')?'':denied('Düzenle')} onclick="importPlan()">⬆ P6 / MS Project içe aktar</button></div></div>
  ${late.map(t=>`<div class="alert bad">⏰ <div><b>Gecikme alarmı:</b> "${t.n}" kritik yolda, planın ${t.late} gün gerisinde. Kaba inşaat bitişi kilometre taşı risk altında. <span class="small">(Proje Müdürü ve Teknik Ofis'e e-posta gönderildi)</span></div></div>`).join('')}
  <div class="card tw" style="padding:0"><div class="gantt">
   <div class="g-head"><div class="g-name"><b>Aktivite</b></div><div class="g-months">${months.map(m=>`<span style="left:${pos(days(m))}%">${m.toLocaleDateString('tr-TR',{month:'short',year:'2-digit'})}</span>`).join('')}</div></div>
   ${S.tasks.map(t=>`<div class="g-row"><div class="g-name">${t.c?'<span style="color:#e5484d">●</span> ':''}${t.n}${t.ms?' ◆':''}</div><div class="g-track"><div class="g-today" style="left:${pos(0)}%"></div>

function matchRule(m){
  return [...S.rules].filter(r=>r.active).sort((a,b)=>a.prio-b.prio).find(r=>{
    if(!r.sender&&!r.subject&&!r.kw) return false;
    if(r.sender&&!norm(m.from).includes(norm(r.sender))) return false;
    if(r.subject&&!norm(m.subject).includes(norm(r.subject))) return false;
    if(r.kw){ const t=norm(m.subject+' '+m.body); if(!r.kw.split(',').some(k=>k.trim()&&t.includes(norm(k.trim())))) return false; }

/* ---------------- Chatbot ---------------- */
const BOT={open:false,msgs:[{a:true,t:'Merhaba! Mailler, dokümanlar ve sözleşmeler içinde doğal dille arama yapabilirim. Yetkiniz dahilinde kayıt ekleyip düzenleyebilirim; her değişiklik için önce onayınızı alırım.'}],pending:null};
const SUGG=['Geçen ay Akın Elektrik\'ten gelen satın alma mailini bul','SZL-014 teminat mektubu ne zaman bitiyor?','A Blok kalıp planının son versiyonu','Murat Gül\'e 2 gün yıllık izin gir'];

  return `<div class="bot-h"><b>Yapı365 Asistan</b><small>Yetkiniz dahilindeki verilerde arar · ${ROLES[S.role].name}</small></div>
  <div class="bot-m" id="botm">${BOT.msgs.map(m=>`<div class="msg ${m.a?'a':'u'}">${m.t}</div>`).join('')}</div>
  <div class="sugg">${SUGG.map(s=>`<button onclick="ask(this.textContent)">${esc(s)}</button>`).join('')}</div>
  <div class="bot-i"><input id="bq" placeholder="Bir şey sorun…" onkeydown="if(event.key==='Enter')ask(this.value)"><button class="btn" onclick="ask($('bq').value)">➤</button></div>`;
}
function toggleBot(){ BOT.open=!BOT.open; render(); }
function ask(q){
  q=(q||'').trim(); if(!q) return; BOT.msgs.push({a:false,t:esc(q)}); const n=norm(q); let a;
  if(BOT.pending && /^(evet|onay|onayla|tamam)/.test(n)){ a=BOT.pending(); BOT.pending=null; }
  else if(BOT.pending && /^(hayır|iptal|vazgeç)/.test(n)){ BOT.pending=null; a='İptal edildi, hiçbir kayıt değişmedi.'; }
  else if(/mail|e-posta|eposta/.test(n)){
    if(!can('MAIL')&&!can('SOZLESME')) a='Bu bilgiye erişim yetkiniz yok.';
    else { const words=n.split(/\s+/).filter(w=>w.length>3&&!/mail|bul|gelen|geçen|ayki|kişisinden|'den|'dan/.test(w));
      const hits=S.mails.filter(m=>words.some(w=>norm(m.from+' '+m.subject).includes(w.replace(/['’](den|dan|ten|tan)$/,'').slice(0,6))));
      const lastMonth=/geçen ay/.test(n); const res=(lastMonth?hits.filter(m=>days(m.at)<-20):hits);
      a=res.length?`${res.length} mail buldum${lastMonth?' (geçen ay)':''}:<div class="res">${res.map(m=>`<div>✉ <b>${esc(m.subject)}</b><br><span class="muted">${esc(m.from)} · ${fD(m.at)}</span><br><span class="muted">→ ${esc(m.res)}</span></div>`).join('<br>')}</div>`:'Eşleşen mail bulamadım. Gönderen adı veya konudan bir kelimeyle tekrar deneyin.'; }
  }
  else if(/teminat|sözleşme|szl-/.test(n)){
    if(!can('SOZLESME')) a='Sözleşme verilerini görme yetkiniz yok.';
    else { const c=S.contracts.find(c=>n.includes(norm(c.no)))||S.contracts.find(c=>norm(c.party).split(' ').some(w=>w.length>3&&n.includes(w)));
      a=c?`<b>${c.no} · ${esc(c.party)}</b><div class="res">Bedel: ${fM(c.amount)} ₺<br>Bitiş: ${fD(c.end)} (${days(c.end)} gün)<br>${c.g?`Teminat: ${fM(c.g)} ₺ · mektup bitişi <b>${fD(c.gEnd)}</b> (${days(c.gEnd)} gün)`:'Teminat yok'}</div>`:`Teminatı 60 gün içinde biten sözleşmeler:<div class="res">${S.contracts.filter(c=>c.gEnd&&days(c.gEnd)<=60).map(c=>`${c.no} · ${esc(c.party)} → ${fD(c.gEnd)}`).join('<br>')}</div>`; }
  }
  else if(/versiyon|doküman|plan|dosya|proje/.test(n)){
    if(!can('DOKUMAN')) a='Doküman görme yetkiniz yok.';
    else { const words=n.split(/\s+/).filter(w=>w.length>3); const d=S.docs.map(d=>({d,s:words.filter(w=>norm(d.title+' '+d.folder).includes(w.slice(0,5))).length})).sort((x,y)=>y.s-x.s)[0];
      a=d&&d.s?`<b>${esc(d.d.title)}</b><div class="res">Son versiyon: <b>v${d.d.v[0].n}</b> · ${esc(d.d.v[0].file)}<br>${esc(d.d.v[0].by)} · ${fD(d.d.v[0].at)}<br>Klasör: ${esc(d.d.folder)} · SharePoint ✓</div>`:'Doküman bulamadım.'; }
  }
  else if(/izin/.test(n)){
    const p=Object.keys(S.puantaj).find(x=>n.includes(norm(x).split(' ')[0]));
    const g=+(n.match(/(\d+)\s*gün/)||[0,1])[1];
    if(!can('IK','E')) a=`Bu işlem için İK modülünde <b>Düzenle</b> yetkisi gerekiyor. Rolünüz: ${ROLES[S.role].name}.`;
    else if(!p) a='Hangi personel için? Örn. "Murat Gül\'e 2 gün yıllık izin gir"';
    else { a=`Şu kaydı oluşturacağım:<div class="res"><b>${p}</b> · Yıllık izin · ${g} gün · ${fD(addD(7))} başlangıç</div>Onaylıyor musunuz? <b>evet</b> / <b>iptal</b>`;
      BOT.pending=()=>{ S.leaves.unshift({id:Date.now(),p,type:'Yıllık izin',from:addD(7),to:addD(7+g-1),dayCount:g,status:'Onay bekliyor',balance:12}); log('İK',p,`Asistan üzerinden ${g} gün izin talebi oluşturuldu`); return `✓ İzin talebi oluşturuldu ve İK onayına gönderildi. <a onclick="go('IK')">Görüntüle →</a>`; }; }
  }
  else a='Mailler, sözleşmeler, teminatlar, dokümanlar ve izinler hakkında sorabilirsiniz. Örnek: "geçen ay X firmasından gelen satın alma mailini bul".';
  BOT.msgs.push({a:true,t:a}); render(); setTimeout(()=>$('bq')&&$('bq').focus(),0);
}

render();
</script>
</body>
</html>
