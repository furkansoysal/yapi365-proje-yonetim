services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yapi365
      POSTGRES_USER: yapi365
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yapi365}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yapi365 -d yapi365"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      STORAGE_DIR: /data/files
    ports:
      - "8080:8080"
    volumes:
      - files:/data/files

volumes:
  pgdata:
  files:
